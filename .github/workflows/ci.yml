name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-base:
    strategy:
      fail-fast: false
      matrix:
        host-os:
          - ubuntu-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.host-os }}
    timeout-minutes: 15
    env:
      MY_JOB_VAR: 'allons-y!'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Alpine Linux edge
        uses: ./
        with:
          packages: build-base
        id: setup-alpine

      - name: Output environment
        run: |
          uname -a
          cat /etc/os-release
          env
        shell: alpine.sh {0}

      - name: Prepare environment
        run: echo "export MY_PROFILE_VAR=42" >> ~/.profile
        shell: alpine.sh {0}

      - name: Check that default working directory is the workspace
        run: |
          pwd
          test "$(pwd)" = "${{ github.workspace }}"
        shell: alpine.sh {0}

      - name: Check that default environment variables are available
        run: |
          echo $GITHUB_WORKSPACE
          test "$GITHUB_WORKSPACE" = "${{ github.workspace }}"
        shell: alpine.sh {0}

      - name: Check that job environment variables are available
        run: |
          echo $MY_JOB_VAR
          test "$MY_JOB_VAR" = "${{ env.MY_JOB_VAR }}"
        shell: alpine.sh {0}

      - name: Check that ~/.profile is being sourced
        run: |
          echo "$MY_PROFILE_VAR"
          test "$MY_PROFILE_VAR" = 42
        shell: alpine.sh {0}

      - name: Check that 'uname -m' returns x86_64
        run: |
          uname -m
          test "$(uname -m)" = 'x86_64'
        shell: alpine.sh {0}

      - name: Check that the edge repositories are configured
        run: grep -q '/edge/main$' /etc/apk/repositories
        shell: alpine.sh {0}

      - name: Check that $USER is 'runner' when shell is 'alpine.sh {0}'
        run: |
          id -un
          test "$(id -un)" = 'runner'
        shell: alpine.sh {0}

      - name: Check that $USER is 'root' when shell is 'alpine.sh --root {0}'
        run: |
          id -un
          test "$(id -un)" = 'root'
        shell: alpine.sh --root {0}

      - name: Check that the env file with job variables is not left behind
        run: test ! -e /tmp/.env.sh
        shell: alpine.sh {0}

      - name: Check that steps.<step>.outputs.root-path is set and points to the chroot dir
        run: test -f "${{ steps.setup-alpine.outputs.root-path }}"/etc/alpine-release

      - name: Check that 'packages' were installed
        run: gcc --version
        shell: alpine.sh {0}

      - name: Check that apk works
        run: apk add ruby
        shell: alpine.sh --root {0}

  test-multi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install first Alpine Linux environment
        uses: ./
        with:
          shell-name: alpine-one.sh
        id: alpine-one

      - name: Install second Alpine Linux environment
        uses: ./
        with:
          shell-name: alpine-two.sh
          volumes: ${{ steps.alpine-one.outputs.root-path }}:/mnt/alpine-one
        id: alpine-two

      - name: Check that the environments are separate directories
        run: test "${{ steps.alpine-one.outputs.root-path }}" != "${{ steps.alpine-two.outputs.root-path }}"

      - name: Check that the first chroot is bind-mounted in the second one
        run: test -f /mnt/alpine-one/etc/alpine-release
        shell: alpine-two.sh {0}

  test-invalid-input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Alpine Linux with an invalid shell-name
        id: invalid
        uses: ./
        continue-on-error: true
        with:
          shell-name: '1 invalid'

      - name: Check that the invalid input was rejected
        run: test "${{ steps.invalid.outcome }}" = failure
